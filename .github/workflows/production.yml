name: Next JS Web Docker Deploy

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    name: Build and Deploy to Docker
    runs-on: ubuntu-latest
    
    env:
      CONTAINER_NAME: sunum-yapici-web
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/app:sunum-yapici-web
      PORT: 3007

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}
      
      - name: SSH into server and redeploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo ${{ secrets.DOCKER_TOKEN }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker pull ${{ env.IMAGE_NAME }}
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            docker run -d -p ${{ env.PORT }}:80 --restart=always --name ${{ env.CONTAINER_NAME }} ${{ env.IMAGE_NAME }}
            docker image prune -f || true
      
      - name: Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: "${{ secrets.TELEGRAM_TO }}"
          token: "${{ secrets.TELEGRAM_TOKEN }}"
          message: "✅ ${{ env.CONTAINER_NAME }} Deployed 🚀"
